spring.application.name=iam-admin-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/pulsepass}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs}
spring.flyway.locations=classpath:db/messaging,classpath:db/migration
spring.mvc.problemdetails.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
