spring.application.name=api-gateway
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/pulsepass}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs}
spring.data.redis.host=${REDIS_HOST:redis}
spring.cloud.gateway.routes[0].id=inventory-service
spring.cloud.gateway.routes[0].uri=http://inventory-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/inventory/events/**,/api/inventory/organizer/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=http://order-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].id=iam-admin-service
spring.cloud.gateway.routes[2].uri=http://iam-admin-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/iam/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[3].id=realtime-service
spring.cloud.gateway.routes[3].uri=ws://realtime-service:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/ws
