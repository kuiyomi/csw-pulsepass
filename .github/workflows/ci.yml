name: Verificação do backend
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck infra/init-db/*.sh infra/keycloak-init/*.sh infra/kafka/*.sh
      - run: python3 -m py_compile scripts/testar-compra.py && node --check scripts/testar-telas.cjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
  integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress -Pintegration verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: python3 scripts/testar-compra.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
      - run: "$RUNNER_TEMP/browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node scripts/testar-telas.cjs
      - if: failure()
        run: docker compose ps -a
