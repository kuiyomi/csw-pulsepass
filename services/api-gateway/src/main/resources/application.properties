spring.application.name=api-gateway
spring.cloud.gateway.routes[0].id=public-catalog
spring.cloud.gateway.routes[0].uri=${INVENTORY_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/inventory/events,/api/inventory/events/{id}
spring.cloud.gateway.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
